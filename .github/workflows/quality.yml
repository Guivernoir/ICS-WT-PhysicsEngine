name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hydrasim-quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_PYTHON_VERSION_WARNING: "1"
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package, Modbus support, and dev tools
        run: python -m pip install -e ".[dev,modbus]"

      - name: Dependency check
        run: python -m pip check

      - name: Format check
        run: python -m black --check src tests tools

      - name: Lint
        run: python -m ruff check src tools tests

      - name: Type check
        run: python -m mypy src/hydrasim

      - name: Compile check
        run: python -m compileall -q src tests tools

      - name: Quality policy check
        run: python tools/check_project_quality.py

      - name: Unit tests
        run: python -m unittest discover -s tests -v
