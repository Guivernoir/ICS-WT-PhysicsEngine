name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hydrasim-quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_PYTHON_VERSION_WARNING: "1"
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package, Modbus support, and dev tools
        run: python -m pip install -e ".[dev,modbus]"

      - name: Dependency check
        run: python -m pip check

      - name: Format check
        run: python -m black --check src tests tools

      - name: Lint
        run: python -m ruff check src tools tests

      - name: Type check
        run: python -m mypy src/hydrasim

      - name: Compile check
        run: python -m compileall -q src tests tools

      - name: Quality policy check
        run: python tools/check_project_quality.py

      - name: Unit tests with coverage
        run: |
          python -m coverage run -m unittest discover -s tests -v
          python -m coverage report
          python -m coverage xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v5
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error

  hmi-quality:
    name: HMI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: hmi/.nvmrc
          cache: npm
          cache-dependency-path: hmi/package-lock.json

      - name: Install HMI dependencies
        working-directory: hmi
        run: npm ci

      - name: Audit HMI dependencies
        working-directory: hmi
        run: npm audit

      - name: Lint HMI
        working-directory: hmi
        run: npm run lint

      - name: Type check HMI
        working-directory: hmi
        run: npm run check

      - name: Test HMI
        working-directory: hmi
        run: npm run test

      - name: Build HMI
        working-directory: hmi
        run: npm run build

  rust-runtime-quality:
    name: Rust Runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt

      - name: Format Rust runtime
        working-directory: runtime
        run: cargo fmt --check

      - name: Check Rust runtime
        working-directory: runtime
        run: cargo check --locked

      - name: Test Rust runtime
        working-directory: runtime
        run: cargo test --locked

      - name: Lint Rust runtime
        working-directory: runtime
        run: cargo clippy --locked --all-targets -- -D warnings
